<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Balanarkk • Aliança</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =====================================================
   CONFIGURAÇÕES
===================================================== */

:root {
    --preto: #050407;
    --preto2: #0a080d;
    --roxo: #8b3fc7;
    --roxo-claro: #c178ff;
    --roxo-escuro: #35104e;
    --branco: #f5effb;
    --cinza: #99929f;
    --borda: rgba(170, 82, 230, .30);
}


/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--preto);
    color: var(--branco);
    font-family: "Inter", sans-serif;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font-family: inherit;
}


/* =====================================================
   FUNDO
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(111, 35, 160, .13),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 60%,
            rgba(103, 31, 153, .08),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 70%,
            rgba(145, 54, 205, .08),
            transparent 30%
        );
}


/* =====================================================
   PARTICULAS
===================================================== */

.particle {
    position: fixed;
    width: 2px;
    height: 2px;
    background: #d8a3ff;
    border-radius: 50%;
    opacity: .6;
    pointer-events: none;
    z-index: -1;

    box-shadow:
        0 0 8px #b85fff,
        0 0 15px #8e35c4;

    animation: brilho 3s infinite alternate;
}

.p1 { top: 15%; left: 8%; }
.p2 { top: 35%; left: 18%; animation-delay: 1s; }
.p3 { top: 20%; right: 15%; animation-delay: .5s; }
.p4 { top: 60%; right: 8%; animation-delay: 1.5s; }
.p5 { top: 80%; left: 25%; animation-delay: 2s; }
.p6 { top: 72%; left: 75%; animation-delay: .7s; }

@keyframes brilho {
    from {
        opacity: .15;
        transform: scale(.7);
    }
    to {
        opacity: 1;
        transform: scale(1.8);
    }
}


/* =====================================================
   NAVBAR
===================================================== */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 75px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(4, 3, 6, .92);
    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(145, 70, 190, .18);

    z-index: 1000;
}

.logo {
    font-family: "Cinzel", serif;
    font-weight: 900;
    font-size: 23px;
    letter-spacing: -1px;

    color: #eee;

    text-shadow:
        0 0 8px #b56cff,
        0 0 25px rgba(160, 62, 220, .7);
}

.logo small {
    display: block;
    text-align: center;

    font-family: "Inter", sans-serif;
    font-size: 7px;
    letter-spacing: 5px;

    color: var(--roxo-claro);
}

nav {
    display: flex;
    gap: 28px;
}

nav a {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .5px;

    color: #c8c3ca;

    transition: .3s;
}

nav a:hover {
    color: #d292ff;

    text-shadow:
        0 0 10px #a74fe0;
}

.header-btn {
    padding: 11px 18px;

    border: 1px solid var(--roxo);
    border-radius: 5px;

    font-size: 10px;
    font-weight: 700;

    color: white;

    transition: .3s;
}

.header-btn:hover {
    background: var(--roxo);
    box-shadow: 0 0 25px rgba(151, 56, 210, .55);
}


/* =====================================================
   HERO
===================================================== */

.hero {
    min-height: 720px;

    padding: 130px 5% 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 50px;

    position: relative;

    background:
        radial-gradient(
            circle at 75% 50%,
            rgba(90, 23, 130, .28),
            transparent 33%
        );
}

.hero-text {
    max-width: 560px;
    z-index: 2;
}

.eyebrow {
    color: #b967e9;

    font-family: "Cinzel", serif;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: 4px;

    text-shadow:
        0 0 10px rgba(174, 74, 235, .5);
}

.hero h1 {
    margin-top: 14px;

    font-family: "Cinzel", serif;

    font-size: clamp(55px, 9vw, 105px);

    line-height: .95;

    font-weight: 900;

    background:
        linear-gradient(
            180deg,
            #ffffff 5%,
            #e9d7fa 35%,
            #ad62df 70%,
            #5e287c 100%
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    filter:
        drop-shadow(0 0 10px rgba(196, 120, 255, .35))
        drop-shadow(0 0 30px rgba(125, 43, 176, .3));
}

.hero h2 {
    margin-top: 12px;

    font-family: "Cinzel", serif;

    font-size: 16px;
    letter-spacing: 7px;

    color: #e1d8e7;
}

.hero-description {
    margin-top: 25px;

    max-width: 500px;

    color: #aaa3ae;

    font-size: 14px;

    line-height: 1.8;
}

.buttons {
    display: flex;
    gap: 13px;

    margin-top: 30px;
}

.btn {
    padding: 14px 25px;

    border-radius: 5px;

    font-size: 10px;
    font-weight: 800;
    letter-spacing: .5px;

    transition: .3s;
}

.btn-primary {
    background:
        linear-gradient(
            135deg,
            #9a42d2,
            #561878
        );

    border: 1px solid #b661ed;

    box-shadow:
        0 0 20px rgba(143, 50, 201, .25);
}

.btn-primary:hover {
    transform: translateY(-3px);

    box-shadow:
        0 0 35px rgba(174, 69, 238, .65);
}

.btn-secondary {
    border: 1px solid #4b3a55;

    color: #e8e0ec;
}

.btn-secondary:hover {
    border-color: #a04dd0;

    box-shadow:
        0 0 20px rgba(143, 50, 201, .2);
}


/* =====================================================
   LOGO GIGANTE
===================================================== */

.hero-art {
    width: min(500px, 45vw);
    aspect-ratio: 1;

    border-radius: 50%;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(106, 35, 150, .7),
            rgba(13, 8, 17, .95) 62%
        );

    border: 2px solid rgba(208, 179, 226, .65);

    box-shadow:
        0 0 20px rgba(140, 57, 184, .35),
        0 0 70px rgba(104, 32, 143, .25),
        inset 0 0 80px rgba(101, 35, 140, .35);

    overflow: hidden;
}

.hero-art::before {
    content: "";

    position: absolute;
    inset: 12px;

    border-radius: 50%;

    border: 1px solid rgba(182, 116, 220, .2);
}

.hero-art::after {
    content: "♛";

    position: absolute;

    top: 16%;

    font-size: 75px;

    color: #d9b7ec;

    text-shadow:
        0 0 15px #b763e3,
        0 0 35px #70289b;

    opacity: .95;
}

.big-letter {
    font-family: "Cinzel", serif;

    font-size: clamp(170px, 25vw, 280px);

    font-weight: 900;

    color: #eadcf0;

    line-height: 1;

    transform: translateY(35px);

    text-shadow:
        3px 3px 0 #693084,
        0 0 15px #d38cff,
        0 0 50px rgba(138, 47, 186, .9);
}

.art-name {
    position: absolute;

    bottom: 23%;

    font-family: "Cinzel", serif;

    font-size: clamp(25px, 4vw, 43px);

    font-weight: 900;

    letter-spacing: 2px;

    color: #f0e9f4;

    text-shadow:
        0 0 15px #a64ad5,
        0 0 30px #652a80;
}


/* =====================================================
   ESTATÍSTICAS
===================================================== */

.stats {
    margin: -20px 5% 80px;

    display: grid;
    grid-template-columns: repeat(4, 1fr);

    background:
        linear-gradient(
            100deg,
            rgba(13, 10, 17, .98),
            rgba(9, 7, 12, .98)
        );

    border: 1px solid rgba(139, 63, 190, .25);

    border-radius: 9px;

    box-shadow:
        0 0 30px rgba(89, 30, 121, .08);

    overflow: hidden;
}

.stat {
    padding: 28px 15px;

    text-align: center;

    border-right: 1px solid rgba(255,255,255,.07);
}

.stat:last-child {
    border-right: none;
}

.stat-icon {
    font-size: 24px;

    color: #bd6ff1;

    text-shadow:
        0 0 15px #9d48cc;
}

.stat strong {
    display: block;

    margin-top: 8px;

    font-family: "Cinzel", serif;

    font-size: 28px;

    color: #eee;
}

.stat span {
    color: #77727b;

    font-size: 9px;

    letter-spacing: 2px;
}


/* =====================================================
   SEÇÕES
===================================================== */

section {
    scroll-margin-top: 90px;
}


/* =====================================================
   SOBRE
===================================================== */

.about {
    margin: 0 5% 80px;

    padding: 35px;

    display: grid;
    grid-template-columns: 1fr 1.2fr;

    gap: 55px;

    align-items: center;

    background:
        linear-gradient(
            120deg,
            rgba(13, 9, 17, .95),
            rgba(8, 7, 10, .95)
        );

    border: 1px solid rgba(139, 63, 190, .27);

    border-radius: 9px;
}

.about-art {
    min-height: 350px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 6px;

    background:
        radial-gradient(
            circle,
            rgba(112, 39, 151, .45),
            transparent 65%
        );

    border: 1px solid rgba(140, 64, 184, .2);
}

.shield {
    font-size: 150px;

    filter:
        drop-shadow(0 0 15px #a04ed2)
        drop-shadow(0 0 40px #662681);
}

.about h2,
.categories h2,
.cta h2 {
    margin: 14px 0 18px;

    font-family: "Cinzel", serif;

    font-size: clamp(27px, 4vw, 38px);

    color: #eee;
}

.about-text {
    color: #98919d;

    font-size: 13px;

    line-height: 1.9;
}

.features {
    margin-top: 25px;

    display: grid;

    gap: 14px;
}

.feature {
    color: #d4ced8;

    font-size: 12px;
}

.feature span {
    display: inline-flex;

    width: 27px;
    height: 27px;

    align-items: center;
    justify-content: center;

    margin-right: 8px;

    border-radius: 50%;

    background: rgba(124, 45, 169, .22);

    color: #c075ee;
}


/* =====================================================
   CATEGORIAS
===================================================== */

.categories {
    padding: 10px 5% 80px;

    text-align: center;
}

.category-grid {
    margin-top: 35px;

    display: grid;

    grid-template-columns: repeat(6, 1fr);

    gap: 13px;
}

.card {
    padding: 25px 12px;

    min-height: 190px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            160deg,
            #0d0a10,
            #08070b
        );

    border: 1px solid rgba(139, 63, 190, .25);

    border-radius: 6px;

    transition: .35s;
}

.card:hover {
    transform: translateY(-7px);

    border-color: #9b49ce;

    box-shadow:
        0 10px 30px rgba(111, 36, 151, .25),
        0 0 20px rgba(141, 52, 190, .1);
}

.card-icon {
    font-size: 32px;

    margin-bottom: 15px;

    filter:
        drop-shadow(0 0 8px #9e48d1);
}

.card h3 {
    font-family: "Cinzel", serif;

    font-size: 13px;
}

.card p {
    margin: 7px 0 15px;

    color: #77717b;

    font-size: 10px;
}

.card button {
    padding: 8px 14px;

    background: transparent;

    border: 1px solid #60377a;

    color: #cfc4d4;

    font-size: 8px;
    font-weight: 700;

    cursor: pointer;

    transition: .3s;
}

.card button:hover {
    background: #71328e;

    color: white;

    box-shadow:
        0 0 15px rgba(146, 53, 194, .4);
}


/* =====================================================
   REGRAS + RANKING
===================================================== */

.two-columns {
    margin: 0 5% 60px;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;
}

.panel {
    padding: 30px;

    background: #09070c;

    border: 1px solid rgba(139, 63, 190, .25);

    border-radius: 7px;
}

.rule {
    display: flex;

    align-items: center;

    gap: 20px;

    padding: 16px 0;

    border-bottom: 1px solid rgba(255,255,255,.06);
}

.rule:last-child {
    border-bottom: none;
}

.rule-number {
    font-family: "Cinzel", serif;

    color: #a955d3;

    font-size: 14px;
}

.rule-text {
    color: #aaa3ad;

    font-size: 12px;
}


/* =====================================================
   RANKING
===================================================== */

.ranking-item {
    display: grid;

    grid-template-columns: 35px 45px 1fr 40px;

    align-items: center;

    gap: 10px;

    padding: 13px 0;

    border-bottom: 1px solid rgba(255,255,255,.06);
}

.position {
    font-family: "Cinzel", serif;

    font-size: 18px;

    color: #d5b4e5;
}

.avatar {
    width: 34px;
    height: 34px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle,
            #7b3a9d,
            #1c1023
        );

    border: 1px solid #74418b;

    font-size: 15px;
}

.group-name {
    font-size: 12px;
    font-weight: 600;
}

.members {
    display: block;

    margin-top: 3px;

    color: #6f6873;

    font-size: 9px;
}

.crown {
    font-size: 19px;
}


/* =====================================================
   BOTÃO RANKING
===================================================== */

.center-btn {
    display: block;

    margin: 22px auto 0;

    padding: 10px 18px;

    background: transparent;

    border: 1px solid #6f398c;

    color: #ddd;

    font-size: 9px;
    font-weight: 700;

    cursor: pointer;

    transition: .3s;
}

.center-btn:hover {
    background: #712e91;

    box-shadow:
        0 0 20px rgba(145, 49, 193, .4);
}


/* =====================================================
   CTA
===================================================== */

.cta {
    margin: 0 5% 60px;

    padding: 35px 45px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 30px;

    border: 1px solid rgba(139, 63, 190, .35);

    border-radius: 7px;

    background:
        radial-gradient(
            circle at 80% 50%,
            rgba(99, 31, 135, .3),
            transparent 50%
        ),
        #0b080e;
}

.cta p:not(.eyebrow) {
    color: #88818d;

    font-size: 12px;
}


/* =====================================================
   FOOTER
===================================================== */

footer {
    padding: 30px 5%;

    display: flex;

    justify-content: space-between;

    align-items: center;

    border-top: 1px solid rgba(255,255,255,.06);

    color: #65606a;

    font-size: 10px;
}


/* =====================================================
   ANIMAÇÃO DE ENTRADA
===================================================== */

.hero-text {
    animation: aparecer 1s ease forwards;
}

.hero-art {
    animation: aparecerLogo 1.2s ease forwards;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateX(-30px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

@keyframes aparecerLogo {
    from {
        opacity: 0;
        transform: scale(.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =====================================================
   CELULAR
===================================================== */

@media (max-width: 950px) {

    nav {
        display: none;
    }

    .hero {
        min-height: auto;

        padding-top: 120px;

        flex-direction: column;

        text-align: center;
    }

    .hero-text {
        max-width: 700px;
    }

    .hero-description {
        margin-left: auto;
        margin-right: auto;
    }

    .buttons {
        justify-content: center;
    }

    .hero-art {
        width: min(430px, 90vw);
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .stat:nth-child(2) {
        border-right: none;
    }

    .about {
        grid-template-columns: 1fr;

        text-align: center;
    }

    .about-art {
        min-height: 270px;
    }

    .category-grid {
        grid-template-columns: repeat(3, 1fr);
    }

    .two-columns {
        grid-template-columns: 1fr;
    }

    .cta {
        flex-direction: column;

        text-align: center;
    }
}


@media (max-width: 600px) {

    header {
        height: 65px;

        padding: 0 20px;
    }

    .logo {
        font-size: 18px;
    }

    .header-btn {
        font-size: 8px;

        padding: 9px 12px;
    }

    .hero {
        padding-left: 20px;
        padding-right: 20px;
    }

    .hero h1 {
        font-size: 57px;
    }

    .hero h2 {
        font-size: 10px;

        letter-spacing: 4px;
    }

    .hero-description {
        font-size: 12px;
    }

    .buttons {
        flex-direction: column;
    }

    .btn {
        width: 100%;
    }

    .hero-art {
        width: 88vw;
    }

    .big-letter {
        font-size: 170px;
    }

    .art-name {
        font-size: 25px;
    }

    .stats {
        margin-left: 20px;
        margin-right: 20px;

        grid-template-columns: repeat(2, 1fr);
    }

    .stat {
        padding: 20px 10px;
    }

    .stat strong {
        font-size: 22px;
    }

    .about {
        margin-left: 20px;
        margin-right: 20px;

        padding: 20px;
    }

    .about-art {
        min-height: 220px;
    }

    .shield {
        font-size: 110px;
    }

    .categories {
        padding-left: 20px;
        padding-right: 20px;
    }

    .category-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .card {
        min-height: 175px;
    }

    .two-columns {
        margin-left: 20px;
        margin-right: 20px;
    }

    .panel {
        padding: 20px;
    }

    .cta {
        margin-left: 20px;
        margin-right: 20px;

        padding: 30px 20px;
    }

    footer {
        flex-direction: column;

        gap: 15px;

        text-align: center;
    }
}

</style>
</head>


<body>

<!-- PARTICULAS -->

<div class="particle p1"></div>
<div class="particle p2"></div>
<div class="particle p3"></div>
<div class="particle p4"></div>
<div class="particle p5"></div>
<div class="particle p6"></div>


<!-- =====================================================
     MENU
===================================================== -->

<header>

    <a href="#inicio" class="logo">
        Balanarkk
        <small>ALIANÇA</small>
    </a>

    <nav>
        <a href="#inicio">INÍCIO</a>
        <a href="#sobre">SOBRE</a>
        <a href="#grupos">GRUPOS</a>
        <a href="#regras">REGRAS</a>
        <a href="#ranking">RANKING</a>
        <a href="#contato">CONTATO</a>
    </nav>

    <a
        href="https://chat.whatsapp.com/"
        target="_blank"
        class="header-btn"
    >
        ☘ ENTRAR NA ALIANÇA
    </a>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero" id="inicio">

    <div class="hero-text">

        <div class="eyebrow">
            ✦ SEJA BEM-VINDO À ✦
        </div>

        <h1>
            Balanarkk
        </h1>

        <h2>
            ALIANÇA DE GRUPOS
        </h2>

        <p class="hero-description">
            União, força e cre
